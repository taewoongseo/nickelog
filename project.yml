name: Nickelog
options:
  bundleIdPrefix: com.nickelog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Nickelog:
    type: application
    platform: iOS
    sources:
      - path: Nickelog
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickelog.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Nickelog/Generated-Info.plist
      properties:
        CFBundleDisplayName: Nickelog
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: NO
        TMDB_API_KEY: "$(TMDB_API_KEY)"
    testTargets:
      - Nickelog

  NickelogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NickelogTests
    dependencies:
      - target: Nickelog
    info:
      path: NickelogTests/Generated-Info.plist

  NickelogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NickelogUITests
    dependencies:
      - target: Nickelog
    info:
      path: NickelogUITests/Generated-Info.plist

schemes:
  Nickelog:
    build:
      targets:
        Nickelog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NickelogTests
        - NickelogUITests
    archive:
      config: Release
